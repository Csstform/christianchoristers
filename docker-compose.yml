services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-choristers}
      POSTGRES_USER: ${POSTGRES_USER:-choristers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-choristers}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-choristers} -d ${POSTGRES_DB:-choristers}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-choristers}:${POSTGRES_PASSWORD:-choristers}@db:5432/${POSTGRES_DB:-choristers}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      UPLOADS_DIR: /data/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Christian Choristers <noreply@christianchoristers.com>}
      AUTH_SECRET: ${AUTH_SECRET:-dev-change-me}
    volumes:
      - uploads:/data/uploads
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
  uploads:
